# PHASE-0 CI repair: this legacy filename previously contained only malformed
# CMake step fragments and created zero runnable GitHub Actions jobs.
# Retain its path for a safe overlay; it is now a Flutter verification workflow.
name: Flutter Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter analyze, tests, invariant and overlay gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter (stable channel)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          python3 --version
          node --version
          npm --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Verify project invariants
        run: |
          python3 tools/verify_no_hardcoded_colors.py
          python3 tools/verify_invariants.py
          python3 tools/selftest_invariant7.py
          python3 tools/selftest_invariant14.py
          python3 tools/verify_phase0_contracts.py
          python3 tools/verify_category_overlay.py
      - name: Run Firestore Rules Emulator Security Matrix
        run: |
          npm --prefix test/rules ci
          npx -y firebase-tools setup:emulators:firestore
          npx -y firebase-tools emulators:exec --config firebase.emulator.json --only firestore "node test/rules/firestore_v2_security_matrix.mjs"

# This CI does not build a signed release, deploy Firestore rules, or prove
# on-device behavior. It may expose pre-existing Linux/dependency failures.
