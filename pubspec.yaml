name: recovery_companion
description: "A private, offline-first recovery companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.31.0
  sqlite3: ^2.9.4
  sqlcipher_flutter_libs: 0.6.8
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  ffi: ^2.2.0
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0
  tflite_flutter: ^0.12.1
  lottie: ^3.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  app_settings: ^9.0.0
  flutter_riverpod: ^3.4.2
  local_auth: ^3.0.2
  timezone: ^0.11.1
  audioplayers: ^6.1.0
  cryptography: ^2.7.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  flutter_map_marker_cluster: ^8.2.2
  share_plus: ^13.3.0
  device_info_plus: ^13.2.0
  llama_cpp_dart: ^0.2.2
  pedometer: ^4.0.2
  file_picker: ^12.1.2
  flutter_pdfview: ^1.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.0
  flutter_secure_storage_platform_interface: ^2.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_circle.png"
  # Adaptive icons (Android 8+): the circle art rides the FULL-BLEED
  # background layer, so it fills the launcher mask edge-to-edge instead of
  # showing as a square inside a circle.
  adaptive_icon_background: "assets/images/app_icon_circle.png"
  adaptive_icon_foreground: "assets/images/app_icon_circle.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/models/
    - assets/lottie/
    - assets/sounds/