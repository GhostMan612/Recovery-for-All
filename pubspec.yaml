name: recovery_companion
description: "A private, offline-first recovery companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.17.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  ffi: ^2.2.0
  http: ^1.6.0
  geolocator: ^13.0.0
  google_maps_flutter: ^2.5.3
  intl: ^0.20.3
  flutter_local_notifications: ^17.1.2
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  app_settings: ^5.1.1
  flutter_riverpod: ^2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.17.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/models/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc